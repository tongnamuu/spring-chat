<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Realtime Chat Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h2 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
        .user-badge { font-size: 0.85rem; background: #334155; padding: 6px 12px; border-radius: 20px; color: #cbd5e1; }
        
        .action-buttons { padding: 15px; display: flex; gap: 10px; border-bottom: 1px solid #334155; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; }

        .room-list-header { padding: 12px 20px 6px; font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; letter-spacing: 0.05em; }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 14px; border-radius: 10px; margin-bottom: 8px; background: #1e293b; border: 1px solid #334155; cursor: pointer; transition: all 0.2s; }
        .room-item:hover, .room-item.active { background: #334155; border-color: #0284c7; }
        .room-title { font-weight: 600; font-size: 0.95rem; color: #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .room-meta { font-size: 0.78rem; color: #94a3b8; margin-top: 4px; display: flex; gap: 10px; }
        .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #0f172a; color: #38bdf8; }

        /* Main Chat Window */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
        .chat-header { height: 65px; border-bottom: 1px solid #334155; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; background: #1e293b; }
        .chat-header-info h3 { font-size: 1.1rem; font-weight: 600; }
        .chat-header-info p { font-size: 0.8rem; color: #94a3b8; }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #ef4444; }
        .status-indicator.connected { color: #22c55e; }
        .dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; }
        .connected .dot { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

        .messages-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 60%; padding: 12px 16px; border-radius: 14px; font-size: 0.9rem; line-height: 1.4; }
        .msg-me { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
        .msg-other { align-self: flex-start; background: #1e293b; border: 1px solid #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
        .msg-system { align-self: center; background: #334155; color: #cbd5e1; font-size: 0.8rem; padding: 6px 14px; border-radius: 20px; }

        .input-area { padding: 16px 24px; border-top: 1px solid #334155; background: #1e293b; display: flex; gap: 12px; }
        .input-area input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px 16px; color: white; outline: none; }
        .input-area input:focus { border-color: #0284c7; }
        .input-area button { padding: 12px 24px; }

        /* Modal */
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: #1e293b; padding: 28px; border-radius: 16px; width: 400px; border: 1px solid #334155; }
        .modal h3 { margin-bottom: 16px; color: #38bdf8; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #cbd5e1; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: white; outline: none; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Spring Chat</h2>
            <div class="user-badge" id="userBadge">로그인 필요</div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="openCreateModal()">+ 방 개설 (Max 50)</button>
            <button class="btn btn-secondary" onclick="openJoinModal()"># 코드로 참여</button>
        </div>

        <div class="room-list-header">내 참여 채팅방</div>
        <div class="room-list" id="roomList">
            <!-- Joined rooms populated here -->
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-info">
                <h3 id="currentRoomTitle">채팅방을 선택하세요</h3>
                <p id="currentRoomMeta">소식함</p>
            </div>
            <div class="status-indicator" id="statusIndicator">
                <span class="dot"></span> <span id="statusText">WS Connecting...</span>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="msg msg-system">채팅방에 참여하거나 선택해 주세요.</div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)" disabled>
            <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()" disabled>전송</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal" style="display: flex;">
        <div class="modal">
            <h3>사용자 로그인 / 생성</h3>
            <div class="form-group">
                <label>아이디 (Username)</label>
                <input type="text" id="usernameInput" value="user1">
            </div>
            <div class="form-group">
                <label>닉네임 (Nickname)</label>
                <input type="text" id="nicknameInput" value="홍길동">
            </div>
            <button class="btn btn-primary" style="width:100%" onclick="login()">입장하기</button>
        </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal-overlay" id="createRoomModal">
        <div class="modal">
            <h3>새 채팅방 개설</h3>
            <div class="form-group">
                <label>채팅방 제목</label>
                <input type="text" id="newRoomTitle" placeholder="예: 개발팀 수다방">
            </div>
            <div class="form-group">
                <label>채팅방 유형</label>
                <select id="newRoomType">
                    <option value="GROUP_PUBLIC">Public (공개 그룹)</option>
                    <option value="GROUP_PRIVATE">Private (비공개 그룹)</option>
                    <option value="DIRECT">1대1 개인 대화</option>
                </select>
            </div>
            <div class="form-group">
                <label>최대 정원 (최대 50명)</label>
                <input type="number" id="newMaxCapacity" value="50" min="2" max="50">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" onclick="closeCreateModal()">취소</button>
                <button class="btn btn-primary" onclick="createRoom()">개설</button>
            </div>
        </div>
    </div>

    <!-- Join Room Modal -->
    <div class="modal-overlay" id="joinRoomModal">
        <div class="modal">
            <h3>초대 코드로 입장</h3>
            <div class="form-group">
                <label>8자리 초대 코드</label>
                <input type="text" id="inviteCodeInput" placeholder="예: A1B2C3D4">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" onclick="closeJoinModal()">취소</button>
                <button class="btn btn-primary" onclick="joinRoom()">입장</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let activeRoom = null;
        let stompClient = null;
        let currentSubscription = null;

        async function login() {
            const username = document.getElementById('usernameInput').value;
            const nickname = document.getElementById('nicknameInput').value;
            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, nickname })
                });
                if (res.ok) {
                    currentUser = await res.json();
                } else {
                    const getRes = await fetch(`/api/users/1`);
                    if (getRes.ok) currentUser = await getRes.json();
                    else currentUser = { userId: 1, username, nickname };
                }
                document.getElementById('userBadge').innerText = currentUser.nickname + ` (#${currentUser.userId})`;
                document.getElementById('loginModal').style.display = 'none';
                initWebSocket();
                loadMyRooms();
            } catch (e) {
                currentUser = { userId: 1, username, nickname };
                document.getElementById('userBadge').innerText = nickname;
                document.getElementById('loginModal').style.display = 'none';
                initWebSocket();
                loadMyRooms();
            }
        }

        function initWebSocket() {
            const socket = new SockJS('/ws-stomp');
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function (frame) {
                console.log('Connected STOMP WebSocket: ' + frame);
                const indicator = document.getElementById('statusIndicator');
                indicator.classList.add('connected');
                document.getElementById('statusText').innerText = 'WS Zero-Downtime Connected';

                if (activeRoom) {
                    subscribeToRoom(activeRoom.roomId, false);
                }
            }, function (error) {
                console.log('STOMP Connection error, auto-reconnecting...', error);
                const indicator = document.getElementById('statusIndicator');
                indicator.classList.remove('connected');
                document.getElementById('statusText').innerText = 'WS Reconnecting...';
                setTimeout(initWebSocket, 3000);
            });
        }

        async function loadMyRooms() {
            if (!currentUser) return;
            const res = await fetch('/api/rooms/my', {
                headers: { 'X-User-Id': currentUser.userId }
            });
            if (res.ok) {
                const rooms = await res.json();
                renderRoomList(rooms);
            }
        }

        function renderRoomList(rooms) {
            const container = document.getElementById('roomList');
            container.innerHTML = '';
            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = `room-item ${activeRoom && activeRoom.roomId === room.roomId ? 'active' : ''}`;
                div.onclick = () => selectRoom(room, false);
                div.innerHTML = `
                    <div class="room-title">
                        <span>${room.title}</span>
                        <span class="tag">${room.roomType}</span>
                    </div>
                    <div class="room-meta">
                        <span>👥 ${room.currentCount} / ${room.maxCapacity}명</span>
                        <span>코드: ${room.inviteCode}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function selectRoom(room, isFirstJoin = false) {
            activeRoom = room;
            document.getElementById('currentRoomTitle').innerText = room.title;
            document.getElementById('currentRoomMeta').innerText = `초대코드: ${room.inviteCode} | 인원: ${room.currentCount}/${room.maxCapacity}명`;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            subscribeToRoom(room.roomId, isFirstJoin);

            // Load History
            const res = await fetch(`/api/rooms/${room.roomId}/messages`, {
                headers: { 'X-User-Id': currentUser.userId }
            });
            if (res.ok) {
                const msgs = await res.json();
                renderMessages(msgs.reverse());
            }
        }

        function subscribeToRoom(roomId, isFirstJoin = false) {
            if (!stompClient || !stompClient.connected) return;

            // Always unsubscribe from previous subscription to prevent duplicates
            if (currentSubscription) {
                currentSubscription.unsubscribe();
                currentSubscription = null;
            }

            currentSubscription = stompClient.subscribe(`/sub/chat/room/${roomId}`, function (msg) {
                const messageDto = JSON.parse(msg.body);
                appendMessage(messageDto);
            });

            // Only send ENTER event if it's the brand new first join
            if (isFirstJoin) {
                stompClient.send('/pub/chat/message', {}, JSON.stringify({
                    roomId: roomId,
                    senderId: currentUser.userId,
                    senderName: currentUser.nickname,
                    messageType: 'ENTER'
                }));
            }
        }

        function renderMessages(msgs) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            if (msgs.length === 0) {
                container.innerHTML = '<div class="msg msg-system">아직 대화 내역이 없습니다. 첫 메시지를 보내보세요!</div>';
                return;
            }
            msgs.forEach(m => appendMessage(m));
        }

        function appendMessage(m) {
            const container = document.getElementById('messagesContainer');
            // Remove empty prompt if present
            if (container.children.length === 1 && container.children[0].classList.contains('msg-system') && container.children[0].innerText.includes('아직 대화 내역이 없습니다')) {
                container.innerHTML = '';
            }

            const div = document.createElement('div');
            
            if (m.messageType === 'SYSTEM' || m.messageType === 'ENTER' || m.messageType === 'LEAVE') {
                div.className = 'msg msg-system';
                div.innerText = m.content;
            } else if (m.senderId === currentUser.userId) {
                div.className = 'msg msg-me';
                div.innerText = m.content;
            } else {
                div.className = 'msg msg-other';
                div.innerHTML = `<div class="msg-sender">${m.senderName || '알 수 없음'}</div>${m.content}`;
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !activeRoom) return;

            const dto = {
                roomId: activeRoom.roomId,
                senderId: currentUser.userId,
                senderName: currentUser.nickname,
                messageType: 'TALK',
                content: content
            };

            stompClient.send('/pub/chat/message', {}, JSON.stringify(dto));
            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function openCreateModal() { document.getElementById('createRoomModal').style.display = 'flex'; }
        function closeCreateModal() { document.getElementById('createRoomModal').style.display = 'none'; }
        function openJoinModal() { document.getElementById('joinRoomModal').style.display = 'flex'; }
        function closeJoinModal() { document.getElementById('joinRoomModal').style.display = 'none'; }

        async function createRoom() {
            const title = document.getElementById('newRoomTitle').value;
            const roomType = document.getElementById('newRoomType').value;
            const maxCapacity = parseInt(document.getElementById('newMaxCapacity').value);

            const res = await fetch('/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser.userId },
                body: JSON.stringify({ title, roomType, maxCapacity })
            });

            if (res.ok) {
                const room = await res.json();
                closeCreateModal();
                await loadMyRooms();
                selectRoom(room, true); // send ENTER once on new creation
            } else {
                alert('방 개설 실패');
            }
        }

        async function joinRoom() {
            const inviteCode = document.getElementById('inviteCodeInput').value.trim();
            const res = await fetch('/api/rooms/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser.userId },
                body: JSON.stringify({ inviteCode })
            });

            if (res.ok) {
                const room = await res.json();
                closeJoinModal();
                await loadMyRooms();
                selectRoom(room, true); // send ENTER once on new join via code
            } else {
                alert('입장 실패');
            }
        }
    </script>
</body>
</html>
