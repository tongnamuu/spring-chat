<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Realtime Chat Dashboard</title>
    <script src="/webjars/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/2.3.4/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .sidebar-header h2 { flex: none; font-size: 1.1rem; font-weight: 700; color: #38bdf8; white-space: nowrap; }
        .user-controls { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; }
        .user-badge { min-width: 0; font-size: 0.85rem; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .logout-button { flex: none; display: none; border: 1px solid #475569; background: transparent; color: #cbd5e1; padding: 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
        .logout-button:hover { background: #334155; color: white; }
        .withdraw-button { flex: none; display: none; border: 1px solid #7f1d1d; background: transparent; color: #fda4af; padding: 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
        .withdraw-button:hover { background: #7f1d1d; color: white; }
        
        .action-buttons { padding: 15px; display: flex; gap: 10px; border-bottom: 1px solid #334155; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; }

        .room-list-header { padding: 12px 20px 6px; font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; letter-spacing: 0.05em; }
        .room-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-item { padding: 14px; border-radius: 10px; margin-bottom: 8px; background: #1e293b; border: 1px solid #334155; cursor: pointer; transition: all 0.2s; }
        .room-item:hover, .room-item.active { background: #334155; border-color: #0284c7; }
        .room-title { font-weight: 600; font-size: 0.95rem; color: #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .room-meta { font-size: 0.78rem; color: #94a3b8; margin-top: 4px; display: flex; gap: 10px; }
        .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #0f172a; color: #38bdf8; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
        .chat-header { height: 65px; border-bottom: 1px solid #334155; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; background: #1e293b; }
        .chat-header-info h3 { font-size: 1.1rem; font-weight: 600; }
        .chat-header-info p { font-size: 0.8rem; color: #94a3b8; }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #ef4444; }
        .status-indicator.connected { color: #22c55e; }
        .dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 8px #ef4444; }
        .connected .dot { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

        .messages-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 60%; padding: 12px 16px; border-radius: 14px; font-size: 0.9rem; line-height: 1.4; }
        .msg-me { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
        .msg-other { align-self: flex-start; background: #1e293b; border: 1px solid #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
        .msg-system { align-self: center; background: #334155; color: #cbd5e1; font-size: 0.8rem; padding: 6px 14px; border-radius: 20px; }

        .input-area { padding: 16px 24px; border-top: 1px solid #334155; background: #1e293b; display: flex; gap: 12px; }
        .input-area input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px 16px; color: white; outline: none; }
        .input-area input:focus { border-color: #0284c7; }
        .input-area button { padding: 12px 24px; }

        #manageMembersBtn { flex: none; margin: 0 16px; }
        #membersModal .modal { max-height: calc(100vh - 32px); overflow-y: auto; }
        #membersModal h2 { margin-bottom: 12px; font-size: 1.2rem; }
        #membersModal p { font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; margin-bottom: 12px; }
        .member-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid #334155; }
        .member-row span { overflow-wrap: anywhere; }
        .member-row .btn { flex: none; }
        #membersList { margin-bottom: 16px; }
        #membersError { color: #fca5a5; }

        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: #1e293b; padding: 28px; border-radius: 8px; width: min(400px, calc(100vw - 32px)); border: 1px solid #334155; }
        .modal h3 { margin-bottom: 16px; color: #38bdf8; }
        .auth-modal { width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; }
        .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 24px; padding: 4px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; }
        .auth-tab { min-height: 40px; border: 0; border-radius: 6px; background: transparent; color: #94a3b8; font-weight: 700; cursor: pointer; }
        .auth-tab.active { background: #334155; color: #f8fafc; }
        .auth-panel[hidden] { display: none; }
        .auth-success { display: none; margin-bottom: 16px; padding: 12px; border: 1px solid #166534; border-radius: 6px; background: #052e16; color: #bbf7d0; font-size: 0.85rem; line-height: 1.5; }
        .auth-success.visible { display: block; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #cbd5e1; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: white; outline: none; }
        .form-group input:focus { border-color: #38bdf8; }
        .field-hint { margin-top: 5px; color: #94a3b8; font-size: 0.75rem; line-height: 1.4; }
        .field-error { min-height: 17px; margin-top: 5px; color: #fda4af; font-size: 0.76rem; line-height: 1.35; }
        .form-error { min-height: 20px; margin: -6px 0 12px; color: #fda4af; font-size: 0.82rem; }
        .withdraw-warning { margin-bottom: 16px; color: #fecaca; font-size: 0.9rem; line-height: 1.5; }
        .confirm-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; color: #cbd5e1; font-size: 0.85rem; line-height: 1.4; }
        .confirm-row input { margin-top: 3px; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-danger { background: #b91c1c; color: white; }
        .btn-danger:hover { background: #991b1b; }
        .btn-danger:disabled { cursor: not-allowed; opacity: 0.45; }
        @media (max-width: 720px) {
            body { overflow: auto; }
            .sidebar { width: 100%; min-height: 100vh; }
            .chat-area { display: none; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Spring Chat</h2>
            <div class="user-controls">
                <div class="user-badge" id="userBadge">로그인 필요</div>
                <button class="withdraw-button" id="withdrawButton" type="button" onclick="openWithdrawalModal()">회원 탈퇴</button>
                <button class="logout-button" id="logoutButton" type="button" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="openCreateModal()">+ 방 개설 (Max 1,500)</button>
            <button class="btn btn-secondary" onclick="openJoinModal()"># 코드로 참여</button>
        </div>

        <div class="room-list-header">내 참여 채팅방</div>
        <div class="room-list" id="roomList">
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-info">
                <h3 id="currentRoomTitle">채팅방을 선택하세요</h3>
                <p id="currentRoomMeta">소식함</p>
            </div>
            <button class="btn btn-danger" id="manageMembersBtn" onclick="openMembers()" hidden>멤버 관리</button>
            <div class="status-indicator" id="statusIndicator">
                <span class="dot"></span> <span id="statusText">로그인 후 연결</span>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="msg msg-system">채팅방에 참여하거나 선택해 주세요.</div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)" disabled>
            <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()" disabled>전송</button>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal" style="display: flex;">
        <div class="modal auth-modal">
            <div class="auth-tabs" role="tablist" aria-label="계정 메뉴">
                <button class="auth-tab active" id="loginTab" type="button" role="tab" aria-selected="true" onclick="showAuthView('login')">로그인</button>
                <button class="auth-tab" id="signupTab" type="button" role="tab" aria-selected="false" onclick="showAuthView('signup')">회원가입</button>
            </div>
            <div class="auth-success" id="authSuccess" role="status"></div>

            <section class="auth-panel" id="loginPanel" role="tabpanel" aria-labelledby="loginTab">
                <h3>Spring Chat 로그인</h3>
                <div class="form-group">
                    <label for="usernameInput">아이디</label>
                    <input type="text" id="usernameInput" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="passwordInput">비밀번호</label>
                    <input type="password" id="passwordInput" autocomplete="current-password" onkeypress="handleLoginKeyPress(event)">
                </div>
                <div class="form-error" id="loginError" role="alert"></div>
                <button class="btn btn-primary" id="loginButton" style="width:100%" onclick="login()">로그인</button>
            </section>

            <section class="auth-panel" id="signupPanel" role="tabpanel" aria-labelledby="signupTab" hidden>
                <h3>계정 만들기</h3>
                <div class="form-group">
                    <label for="signupUsernameInput">아이디</label>
                    <input type="text" id="signupUsernameInput" autocomplete="username" aria-describedby="signupUsernameHint signupUsernameError">
                    <p class="field-hint" id="signupUsernameHint">3~30자 아이디 또는 50자 이내 이메일</p>
                    <div class="field-error" id="signupUsernameError"></div>
                </div>
                <div class="form-group">
                    <label for="signupNicknameInput">닉네임</label>
                    <input type="text" id="signupNicknameInput" autocomplete="nickname" aria-describedby="signupNicknameHint signupNicknameError">
                    <p class="field-hint" id="signupNicknameHint">앞뒤 공백 없이 2~20자</p>
                    <div class="field-error" id="signupNicknameError"></div>
                </div>
                <div class="form-group">
                    <label for="signupPasswordInput">비밀번호</label>
                    <input type="password" id="signupPasswordInput" autocomplete="new-password" aria-describedby="signupPasswordHint signupPasswordError">
                    <p class="field-hint" id="signupPasswordHint">8~72자, 영문과 숫자를 각각 하나 이상 포함</p>
                    <div class="field-error" id="signupPasswordError"></div>
                </div>
                <div class="form-group">
                    <label for="signupPasswordConfirmInput">비밀번호 확인</label>
                    <input type="password" id="signupPasswordConfirmInput" autocomplete="new-password" onkeypress="handleSignupKeyPress(event)" aria-describedby="signupPasswordConfirmError">
                    <div class="field-error" id="signupPasswordConfirmError"></div>
                </div>
                <div class="form-error" id="signupError" role="alert"></div>
                <button class="btn btn-primary" id="signupButton" style="width:100%" onclick="signup()">회원가입</button>
            </section>
        </div>
    </div>

    <div class="modal-overlay" id="membersModal">
        <div class="modal">
            <h2>멤버 관리</h2>
            <p>강퇴된 멤버는 채팅 내역을 볼 수 없으며 초대 코드로 재입장할 수 없습니다.</p>
            <div id="membersList"></div>
            <p id="membersError" role="alert"></p>
            <button class="btn btn-secondary" onclick="closeMembers()">닫기</button>
        </div>
    </div>

    <div class="modal-overlay" id="createRoomModal">
        <div class="modal">
            <h3>새 채팅방 개설</h3>
            <div class="form-group">
                <label>채팅방 제목</label>
                <input type="text" id="newRoomTitle" placeholder="예: 개발팀 수다방">
            </div>
            <div class="form-group">
                <label>채팅방 유형</label>
                <select id="newRoomType">
                    <option value="GROUP_PUBLIC">Public (공개 그룹)</option>
                    <option value="GROUP_PRIVATE">Private (비공개 그룹)</option>
                    <option value="DIRECT">1대1 개인 대화</option>
                </select>
            </div>
            <div class="form-group">
                <label>최대 정원 (최대 1,500명)</label>
                <input type="number" id="newMaxCapacity" value="50" min="2" max="1500">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" onclick="closeCreateModal()">취소</button>
                <button class="btn btn-primary" onclick="createRoom()">개설</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="joinRoomModal">
        <div class="modal">
            <h3>초대 코드로 입장</h3>
            <div class="form-group">
                <label>8자리 초대 코드</label>
                <input type="text" id="inviteCodeInput" placeholder="예: A1B2C3D4">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" onclick="closeJoinModal()">취소</button>
                <button class="btn btn-primary" onclick="joinRoom()">입장</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="withdrawModal">
        <div class="modal">
            <h3>회원 탈퇴</h3>
            <p class="withdraw-warning">참여 중인 모든 채팅방에서 나가며 계정은 복구할 수 없습니다.</p>
            <div class="form-group">
                <label>현재 비밀번호</label>
                <input type="password" id="withdrawPasswordInput" autocomplete="current-password" onkeypress="handleWithdrawalKeyPress(event)">
            </div>
            <label class="confirm-row">
                <input type="checkbox" id="withdrawConfirm" onchange="updateWithdrawalButton()">
                <span>회원 탈퇴와 채팅방 퇴장을 확인합니다.</span>
            </label>
            <div class="form-error" id="withdrawError" role="alert"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" type="button" onclick="closeWithdrawalModal()">취소</button>
                <button class="btn btn-danger" id="confirmWithdrawButton" type="button" onclick="withdrawAccount()" disabled>탈퇴</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let activeRoom = null;
        let roomListVersion = 0;
        const removedRooms = new Set();
        let stompClient = null;
        let currentSubscription = null;
        let reconnectTimer = null;
        let shouldReconnect = false;
        let historyLoading = false;
        let pendingRoomMessages = [];
        const roomMessageState = new Map();
        let pendingRoomMessageCount = 0;
        let pendingRoomOverflow = false;
        let roomSelectionVersion = 0;
        let pendingRenderMessages = [];
        let renderFrame = null;
        const MAX_VISIBLE_MESSAGES = 500;
        const MAX_PENDING_MESSAGES = 20000;

        const signupFieldErrors = {
            username: 'signupUsernameError',
            nickname: 'signupNicknameError',
            password: 'signupPasswordError'
        };

        function showAuthView(view, preserveSuccess = false) {
            const loginSelected = view === 'login';
            document.getElementById('loginPanel').hidden = !loginSelected;
            document.getElementById('signupPanel').hidden = loginSelected;
            document.getElementById('loginTab').classList.toggle('active', loginSelected);
            document.getElementById('signupTab').classList.toggle('active', !loginSelected);
            document.getElementById('loginTab').setAttribute('aria-selected', String(loginSelected));
            document.getElementById('signupTab').setAttribute('aria-selected', String(!loginSelected));
            document.getElementById('loginError').innerText = '';
            clearSignupErrors();
            if (!preserveSuccess) setAuthSuccess('');
            (loginSelected
                ? document.getElementById('usernameInput')
                : document.getElementById('signupUsernameInput')).focus();
        }

        function setAuthSuccess(message) {
            const success = document.getElementById('authSuccess');
            success.innerText = message;
            success.classList.toggle('visible', Boolean(message));
        }

        function clearSignupErrors() {
            Object.values(signupFieldErrors).forEach(id => document.getElementById(id).innerText = '');
            document.getElementById('signupPasswordConfirmError').innerText = '';
            document.getElementById('signupError').innerText = '';
        }

        async function signup() {
            const username = document.getElementById('signupUsernameInput').value;
            const nickname = document.getElementById('signupNicknameInput').value;
            const password = document.getElementById('signupPasswordInput').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirmInput').value;
            const signupButton = document.getElementById('signupButton');
            clearSignupErrors();
            setAuthSuccess('');

            if (password !== passwordConfirm) {
                document.getElementById('signupPasswordConfirmError').innerText = '비밀번호가 일치하지 않습니다.';
                return;
            }

            signupButton.disabled = true;
            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, nickname, password })
                });
                const body = await response.json();
                if (!response.ok) {
                    if (body.errors) {
                        Object.entries(body.errors).forEach(([field, message]) => {
                            const target = signupFieldErrors[field];
                            if (target) document.getElementById(target).innerText = translateSignupError(field, message);
                        });
                    } else if (response.status === 409) {
                        document.getElementById('signupUsernameError').innerText = '이미 사용 중인 아이디입니다.';
                    } else {
                        document.getElementById('signupError').innerText = '회원가입을 처리할 수 없습니다.';
                    }
                    return;
                }

                document.getElementById('usernameInput').value = body.username;
                document.getElementById('passwordInput').value = '';
                document.getElementById('signupPasswordInput').value = '';
                document.getElementById('signupPasswordConfirmInput').value = '';
                setAuthSuccess('회원가입이 완료되었습니다. 비밀번호를 입력해 로그인하세요.');
                showAuthView('login', true);
                document.getElementById('passwordInput').focus();
            } catch (e) {
                document.getElementById('signupError').innerText = '회원가입 서버에 연결할 수 없습니다.';
            } finally {
                signupButton.disabled = false;
            }
        }

        function translateSignupError(field, message) {
            const messages = {
                username: '3~30자의 영문·숫자·밑줄 아이디 또는 올바른 이메일을 입력해 주세요.',
                nickname: '닉네임은 앞뒤 공백 없이 2~20자로 입력해 주세요.',
                password: '비밀번호는 8~72자이며 영문과 숫자를 각각 포함해야 합니다.'
            };
            return messages[field] || message;
        }

        function handleSignupKeyPress(e) {
            if (e.key === 'Enter') signup();
        }

        async function login() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const loginButton = document.getElementById('loginButton');
            const loginError = document.getElementById('loginError');
            loginError.innerText = '';
            setAuthSuccess('');
            loginButton.disabled = true;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    currentUser = await res.json();
                } else {
                    loginError.innerText = '아이디 또는 비밀번호가 올바르지 않습니다.';
                    return;
                }
                showAuthenticatedUser();
                initWebSocket();
                loadMyRooms();
            } catch (e) {
                loginError.innerText = '로그인 서버에 연결할 수 없습니다.';
            } finally {
                loginButton.disabled = false;
            }
        }

        async function restoreSession() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) return;
                currentUser = await res.json();
                showAuthenticatedUser();
                initWebSocket();
                loadMyRooms();
            } catch (e) {
                console.log('No active login session');
            }
        }

        function showAuthenticatedUser() {
            document.getElementById('userBadge').innerText = currentUser.nickname + ` (#${currentUser.userId})`;
            document.getElementById('withdrawButton').style.display = 'inline-block';
            document.getElementById('logoutButton').style.display = 'inline-block';
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }

        async function logout() {
            disconnectRealtime();
            await fetch('/api/auth/logout', { method: 'POST' });
            resetToLogin();
        }

        function disconnectRealtime() {
            shouldReconnect = false;
            if (reconnectTimer) clearTimeout(reconnectTimer);
            if (currentSubscription) {
                currentSubscription.unsubscribe();
                currentSubscription = null;
            }
            if (stompClient && stompClient.connected) {
                stompClient.disconnect(() => {});
            }
            stompClient = null;
        }

        function resetToLogin() {
            roomSelectionVersion++;
            roomMessageState.clear();
            pendingRoomMessages = [];
            pendingRoomMessageCount = 0;
            pendingRenderMessages = [];
            currentUser = null;
            activeRoom = null;
            removedRooms.clear();
            roomListVersion++;
            closeMembers();
            document.getElementById('manageMembersBtn').hidden = true;
            document.getElementById('userBadge').innerText = '로그인 필요';
            document.getElementById('withdrawButton').style.display = 'none';
            document.getElementById('logoutButton').style.display = 'none';
            document.getElementById('statusIndicator').classList.remove('connected');
            document.getElementById('statusText').innerText = '로그인 후 연결';
            document.getElementById('roomList').innerHTML = '';
            document.getElementById('messagesContainer').innerHTML = '<div class="msg msg-system">채팅방에 참여하거나 선택해 주세요.</div>';
            document.getElementById('messageInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('loginModal').style.display = 'flex';
            showAuthView('login');
            document.getElementById('usernameInput').focus();
        }

        function openWithdrawalModal() {
            document.getElementById('withdrawPasswordInput').value = '';
            document.getElementById('withdrawConfirm').checked = false;
            document.getElementById('withdrawError').innerText = '';
            updateWithdrawalButton();
            document.getElementById('withdrawModal').style.display = 'flex';
            document.getElementById('withdrawPasswordInput').focus();
        }

        function closeWithdrawalModal() {
            document.getElementById('withdrawModal').style.display = 'none';
            document.getElementById('withdrawPasswordInput').value = '';
        }

        function updateWithdrawalButton() {
            document.getElementById('confirmWithdrawButton').disabled = !document.getElementById('withdrawConfirm').checked;
        }

        function handleWithdrawalKeyPress(e) {
            if (e.key === 'Enter' && document.getElementById('withdrawConfirm').checked) withdrawAccount();
        }

        async function withdrawAccount() {
            const password = document.getElementById('withdrawPasswordInput').value;
            const button = document.getElementById('confirmWithdrawButton');
            const error = document.getElementById('withdrawError');
            error.innerText = '';
            button.disabled = true;
            try {
                const response = await fetch('/api/users/me', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (!response.ok) {
                    error.innerText = response.status === 401
                        ? '비밀번호가 올바르지 않습니다.'
                        : '회원 탈퇴를 처리할 수 없습니다.';
                    return;
                }
                closeWithdrawalModal();
                disconnectRealtime();
                document.getElementById('usernameInput').value = '';
                resetToLogin();
            } catch (e) {
                error.innerText = '회원 탈퇴 서버에 연결할 수 없습니다.';
            } finally {
                button.disabled = !document.getElementById('withdrawConfirm').checked;
            }
        }

        function handleLoginKeyPress(e) {
            if (e.key === 'Enter') login();
        }

        function initWebSocket() {
            if (!currentUser) return;
            shouldReconnect = true;
            const localDevelopment = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
            const pinnedEndpoints = new Map([
                ['ccccc', '/ws-stomp-a'],
                ['bbbbb', '/ws-stomp-b']
            ]);
            const endpoint = (localDevelopment && pinnedEndpoints.get(currentUser?.username)) || '/ws-stomp';
            const socket = new SockJS(endpoint);
            stompClient = Stomp.over(socket);
            stompClient.debug = null;
            
            stompClient.connect({}, function (frame) {
                console.log('Connected STOMP WebSocket: ' + frame);
                const indicator = document.getElementById('statusIndicator');
                indicator.classList.add('connected');
                document.getElementById('statusText').innerText = 'WS Zero-Downtime Connected';
                stompClient.subscribe('/user/queue/publish-results', frame => {
                    if (!JSON.parse(frame.body).accepted) {
                        document.getElementById('statusText').innerText = '메시지 전송 실패';
                    }
                });

                stompClient.subscribe('/user/queue/room-events', frame => {
                    const event = JSON.parse(frame.body);
                    if (event.type === 'KICKED') {
                        removeRoomAccess(event.roomId, '방에서 강퇴되었습니다. 다른 채팅방을 선택해 주세요.');
                        loadMyRooms().catch(console.error);
                    }
                });
                loadMyRooms().catch(console.error);
                if (activeRoom) {
                    historyLoading = true;
                    subscribeToRoom(activeRoom.roomId, false);
                    scheduleMissedMessageSync(activeRoom.roomId);
                }
            }, function (error) {
                console.log('STOMP Connection error, auto-reconnecting...', error);
                const indicator = document.getElementById('statusIndicator');
                indicator.classList.remove('connected');
                document.getElementById('statusText').innerText = 'WS Reconnecting...';
                if (shouldReconnect && currentUser) {
                    reconnectTimer = setTimeout(initWebSocket, 3000);
                }
            });
        }

        async function loadMyRooms() {
            if (!currentUser) return;
            const user = currentUser;
            const version = ++roomListVersion;
            const res = await fetch('/api/rooms/my');
            if (res.ok) {
                const rooms = await res.json();
                if (currentUser !== user || version !== roomListVersion) return;
                if (activeRoom && !rooms.some(room => room.roomId === activeRoom.roomId)) {
                    removeRoomAccess(activeRoom.roomId);
                }
                if (activeRoom) {
                    activeRoom = rooms.find(room => room.roomId === activeRoom.roomId);
                    document.getElementById('manageMembersBtn').hidden = activeRoom.createdBy !== currentUser.userId;
                    document.getElementById('currentRoomMeta').innerText = `초대코드: ${activeRoom.inviteCode} | 인원: ${activeRoom.currentCount}/${activeRoom.maxCapacity}명`;
                }
                renderRoomList(rooms.filter(room => !removedRooms.has(room.roomId)));
            } else if (res.status === 401) {
                await logout();
            }
        }

        function removeRoomAccess(roomId, notice = '더 이상 참여 중인 방이 아닙니다. 다른 채팅방을 선택해 주세요.') {
            removedRooms.add(roomId);
            roomListVersion++;
            document.querySelectorAll('.room-item').forEach(item => {
                if (Number(item.dataset.roomId) === roomId) item.remove();
            });
            roomMessageState.delete(roomId);
            if (activeRoom?.roomId !== roomId) return;
            roomSelectionVersion++;
            activeRoom = null;
            if (currentSubscription) {
                try { currentSubscription.unsubscribe(); } catch (_) {}
                currentSubscription = null;
            }
            historyLoading = false;
            pendingRoomMessages = [];
            pendingRoomMessageCount = 0;
            pendingRoomOverflow = false;
            pendingRenderMessages = [];
            if (renderFrame !== null) cancelAnimationFrame(renderFrame);
            renderFrame = null;
            closeMembers();
            document.getElementById('manageMembersBtn').hidden = true;
            document.getElementById('currentRoomTitle').innerText = '채팅방을 선택하세요';
            document.getElementById('currentRoomMeta').innerText = notice;
            document.getElementById('messagesContainer').replaceChildren();
            document.getElementById('messageInput').value = '';
            document.getElementById('messageInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
        }

        setInterval(() => { if (currentUser) loadMyRooms().catch(console.error); }, 5000);
        window.addEventListener('focus', () => { if (currentUser) loadMyRooms().catch(console.error); });

        function closeMembers() { document.getElementById('membersModal').style.display = 'none'; }

        async function openMembers() {
            if (!activeRoom || activeRoom.createdBy !== currentUser?.userId) return;
            const room = activeRoom;
            const version = roomSelectionVersion;
            const isCurrent = () => activeRoom?.roomId === room.roomId && version === roomSelectionVersion;
            document.getElementById('membersModal').style.display = 'flex';
            document.getElementById('membersList').replaceChildren();
            document.getElementById('membersError').textContent = '';
            try {
                const response = await fetch(`/api/rooms/${room.roomId}/members`);
                if ([403, 404].includes(response.status)) {
                    if (isCurrent()) removeRoomAccess(room.roomId);
                    return;
                }
                if (!response.ok) throw new Error('멤버 목록을 불러오지 못했습니다.');
                const members = await response.json();
                if (!isCurrent()) return;
                for (const member of members) {
                    const row = document.createElement('div');
                    row.className = 'member-row';
                    const name = document.createElement('span');
                    name.textContent = member.nickname + (member.userId === room.createdBy ? ' (방장)' : '');
                    row.appendChild(name);
                    if (member.userId !== currentUser.userId) {
                        const button = document.createElement('button');
                        button.className = 'btn btn-danger';
                        button.textContent = '강퇴';
                        button.onclick = async () => {
                            if (!isCurrent() || !confirm(`${member.nickname}님을 강퇴하시겠습니까?`)) return;
                            button.disabled = true;
                            try {
                                const result = await fetch(`/api/rooms/${room.roomId}/members/${member.userId}`, { method: 'DELETE' });
                                if (!result.ok) throw new Error('강퇴하지 못했습니다. 방장 권한과 멤버 상태를 확인해 주세요.');
                                if (!isCurrent()) return;
                                row.remove();
                                await loadMyRooms();
                            } catch (error) {
                                if (isCurrent()) document.getElementById('membersError').textContent = error.message;
                                button.disabled = false;
                            }
                        };
                        row.appendChild(button);
                    }
                    document.getElementById('membersList').appendChild(row);
                }
            } catch (error) {
                if (isCurrent()) document.getElementById('membersError').textContent = error.message;
            }
        }

        function renderRoomList(rooms) {
            const container = document.getElementById('roomList');
            container.innerHTML = '';
            rooms.filter(room => !removedRooms.has(room.roomId)).forEach(room => {
                const div = document.createElement('div');
                div.dataset.roomId = room.roomId;
                div.className = `room-item ${activeRoom && activeRoom.roomId === room.roomId ? 'active' : ''}`;
                div.onclick = () => selectRoom(room, false);
                div.innerHTML = `
                    <div class="room-title">
                        <span>${room.title}</span>
                        <span class="tag">${room.roomType}</span>
                    </div>
                    <div class="room-meta">
                        <span>👥 ${room.currentCount} / ${room.maxCapacity}명</span>
                        <span>코드: ${room.inviteCode}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function selectRoom(room, isFirstJoin = false) {
            if (removedRooms.has(room.roomId)) return;
            closeMembers();
            document.getElementById('manageMembersBtn').hidden = room.createdBy !== currentUser?.userId;
            roomSelectionVersion++;
            activeRoom = room;
            historyLoading = true;
            pendingRoomMessages = [];
            pendingRoomMessageCount = 0;
            pendingRoomOverflow = false;
            pendingRenderMessages = [];
            document.getElementById('messagesContainer').replaceChildren();
            roomMessageState.clear();
            resetRoomMessageState(room.roomId);
            document.getElementById('currentRoomTitle').innerText = room.title;
            document.getElementById('currentRoomMeta').innerText = `초대코드: ${room.inviteCode} | 인원: ${room.currentCount}/${room.maxCapacity}명`;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            subscribeToRoom(room.roomId, isFirstJoin);

            await syncMissedMessages(room.roomId, true);
        }

        function subscribeToRoom(roomId, isFirstJoin = false) {
            if (!stompClient || !stompClient.connected) return;

            if (currentSubscription) {
                currentSubscription.unsubscribe();
                currentSubscription = null;
            }

            currentSubscription = stompClient.subscribe(`/sub/chat/room/${roomId}`, function (msg) {
                if (!activeRoom || activeRoom.roomId !== roomId) return;
                const payload = JSON.parse(msg.body);
                const batch = payload.messages ? payload : { roomId, previousMessageId: 0, messages: [payload] };
                const deliveryNode = msg.headers?.['x-chat-ws-node'];
                batch.messages.forEach(message => { message.deliveryNode = deliveryNode; });
                const state = getRoomMessageState(roomId);
                if (historyLoading || batch.previousMessageId > state.lastReceivedMessageId) {
                    bufferRoomBatch(batch);
                    if (!historyLoading) scheduleMissedMessageSync(roomId);
                    return;
                }
                batch.messages.forEach(message => appendMessage(message));
            });

            if (isFirstJoin) {
                stompClient.send('/pub/chat/message', {}, JSON.stringify({
                    roomId: roomId,
                    messageType: 'ENTER'
                }));
            }
        }

        function renderMessages(msgs) {
            pendingRenderMessages = [];
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            if (msgs.length === 0) {
                container.innerHTML = '<div class="msg msg-system">아직 대화 내역이 없습니다. 첫 메시지를 보내보세요!</div>';
                return;
            }
            msgs.forEach(m => appendMessage(m));
        }

        function resetRoomMessageState(roomId) {
            roomMessageState.set(roomId, {
                seenKeys: new Set(),
                lastReceivedMessageId: 0,
                syncing: false
            });
        }

        function getRoomMessageState(roomId) {
            if (!roomMessageState.has(roomId)) {
                resetRoomMessageState(roomId);
            }
            return roomMessageState.get(roomId);
        }

        function messageKey(m) {
            if (m.eventId) return `event:${m.eventId}`;
            if (m.messageId) return `id:${m.messageId}`;
            return messageSignature(m);
        }

        function messageSignature(m) {
            return [
                'live',
                m.roomId || '',
                m.senderId || '',
                m.messageType || '',
                m.createdAt || '',
                m.content || ''
            ].join(':');
        }

        function rememberMessage(m) {
            const state = getRoomMessageState(m.roomId);
            if (m.messageId && m.messageId <= state.lastReceivedMessageId) return false;
            const key = messageKey(m);
            if (state.seenKeys.has(key)) {
                updateLastReceivedMessageId(state, m);
                return false;
            }
            state.seenKeys.add(key);
            if (state.seenKeys.size > MAX_PENDING_MESSAGES) {
                state.seenKeys.delete(state.seenKeys.values().next().value);
            }
            updateLastReceivedMessageId(state, m);
            return true;
        }

        function updateLastReceivedMessageId(state, m) {
            if (m.messageId && m.messageId > state.lastReceivedMessageId) {
                state.lastReceivedMessageId = m.messageId;
            }
        }

        function bufferRoomBatch(batch) {
            if (pendingRoomMessageCount + batch.messages.length > MAX_PENDING_MESSAGES) {
                pendingRoomMessages = [];
                pendingRoomMessageCount = 0;
                pendingRoomOverflow = true;
            }
            pendingRoomMessages.push(batch);
            pendingRoomMessageCount += batch.messages.length;
        }

        async function syncMissedMessages(roomId, initial = false) {
            if (!currentUser || !activeRoom || activeRoom.roomId !== roomId) return;
            const state = getRoomMessageState(roomId);
            if (state.syncing) return;
            state.syncing = true;
            historyLoading = true;
            const version = roomSelectionVersion;
            const isCurrent = () => version === roomSelectionVersion && currentUser && activeRoom?.roomId === roomId;
            try {
                do {
                    pendingRoomOverflow = false;
                    const headResponse = await fetch(`/api/rooms/${roomId}/messages?limit=${initial ? 50 : 1}`);
                    if ([403, 404].includes(headResponse.status)) {
                        if (isCurrent()) removeRoomAccess(roomId);
                        return;
                    }
                    if (!headResponse.ok) throw new Error('History unavailable');
                    const head = await headResponse.json();
                    if (!isCurrent()) return;
                    const through = head[0]?.messageId || 0;
                    if (initial) {
                        renderMessages(head.reverse());
                        initial = false;
                    }
                    while (state.lastReceivedMessageId < through) {
                        const res = await fetch(`/api/rooms/${roomId}/sync?lastReceivedMessageId=${state.lastReceivedMessageId}&throughMessageId=${through}`);
                        if ([403, 404].includes(res.status)) {
                            if (isCurrent()) removeRoomAccess(roomId);
                            return;
                        }
                        if (!res.ok) throw new Error('Sync unavailable');
                        const missed = await res.json();
                        if (!isCurrent()) return;
                        if (!missed.length) throw new Error('Sync made no progress');
                        missed.forEach(message => appendMessage(message));
                    }
                    if (pendingRoomOverflow) continue;
                    const buffered = pendingRoomMessages;
                    pendingRoomMessages = [];
                    pendingRoomMessageCount = 0;
                    for (let i = 0; i < buffered.length; i++) {
                        const batch = buffered[i];
                        if (batch.previousMessageId > state.lastReceivedMessageId) {
                            buffered.slice(i).forEach(bufferRoomBatch);
                            pendingRoomOverflow = true;
                            break;
                        }
                        batch.messages.forEach(message => appendMessage(message));
                    }
                } while (isCurrent() && pendingRoomOverflow);
                if (isCurrent()) historyLoading = false;
            } catch (e) {
                console.log('Message sync failed', e);
                if (isCurrent()) setTimeout(() => {
                    if (isCurrent()) syncMissedMessages(roomId, initial);
                }, 1000);
            } finally {
                state.syncing = false;
            }
        }

        function scheduleMissedMessageSync(roomId) {
            syncMissedMessages(roomId);
        }

        function appendMessage(m) {
            if (!currentUser || !activeRoom || m.roomId !== activeRoom.roomId) return;
            if (!rememberMessage(m)) return;
            pendingRenderMessages.push(m);
            if (pendingRenderMessages.length > MAX_VISIBLE_MESSAGES) pendingRenderMessages.shift();
            if (renderFrame === null) renderFrame = requestAnimationFrame(flushMessages);
        }

        function flushMessages() {
            renderFrame = null;
            const container = document.getElementById('messagesContainer');
            if (!currentUser || !activeRoom) {
                pendingRenderMessages = [];
                return;
            }
            const stickToBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
            const fragment = document.createDocumentFragment();
            pendingRenderMessages.forEach(m => fragment.appendChild(createMessageElement(m)));
            pendingRenderMessages = [];
            if (container.children.length === 1 && container.children[0].classList.contains('msg-system') && container.children[0].innerText.includes('아직 대화 내역이 없습니다')) {
                container.innerHTML = '';
            }

            container.appendChild(fragment);
            while (container.children.length > MAX_VISIBLE_MESSAGES) container.firstElementChild.remove();
            if (stickToBottom) container.scrollTop = container.scrollHeight;
        }

        function createMessageElement(m) {
            const div = document.createElement('div');
            
            if (m.messageType === 'SYSTEM' || m.messageType === 'ENTER' || m.messageType === 'LEAVE') {
                div.className = 'msg msg-system';
                div.innerText = m.content;
            } else if (m.senderId === currentUser.userId) {
                div.className = 'msg msg-me';
                div.innerText = m.content;
            } else {
                div.className = 'msg msg-other';
                const sender = document.createElement('div');
                sender.className = 'msg-sender';
                sender.innerText = m.senderName || '알 수 없음';
                div.appendChild(sender);
                div.appendChild(document.createTextNode(m.content));
            }
            if (m.deliveryNode || m.sourceNode) {
                const node = document.createElement('div');
                node.className = 'msg-sender';
                node.textContent = [m.sourceNode && `발신 WS: ${m.sourceNode}`,
                    m.deliveryNode && `수신 WS: ${m.deliveryNode}`].filter(Boolean).join(' | ');
                div.appendChild(node);
            }
            return div;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !activeRoom) return;

            const dto = {
                roomId: activeRoom.roomId,
                messageType: 'TALK',
                content: content
            };

            stompClient.send('/pub/chat/message', {}, JSON.stringify(dto));
            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function openCreateModal() { document.getElementById('createRoomModal').style.display = 'flex'; }
        function closeCreateModal() { document.getElementById('createRoomModal').style.display = 'none'; }
        function openJoinModal() { document.getElementById('joinRoomModal').style.display = 'flex'; }
        function closeJoinModal() { document.getElementById('joinRoomModal').style.display = 'none'; }

        async function createRoom() {
            const title = document.getElementById('newRoomTitle').value;
            const roomType = document.getElementById('newRoomType').value;
            const maxCapacity = parseInt(document.getElementById('newMaxCapacity').value);

            const res = await fetch('/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, roomType, maxCapacity })
            });

            if (res.ok) {
                const room = await res.json();
                closeCreateModal();
                await loadMyRooms();
                selectRoom(room, true);
            } else {
                alert('방 개설 실패');
            }
        }

        async function joinRoom() {
            const inviteCode = document.getElementById('inviteCodeInput').value.trim();
            const res = await fetch('/api/rooms/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ inviteCode })
            });

            if (res.ok) {
                const room = await res.json();
                closeJoinModal();
                await loadMyRooms();
                selectRoom(room, true);
            } else {
                alert('입장 실패');
            }
        }

        window.addEventListener('DOMContentLoaded', restoreSession);
    </script>
</body>
</html>
