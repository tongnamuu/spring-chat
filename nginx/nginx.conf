events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream chat_api_upstream {
        zone chat_api 64k;
        server chat-api:8080 resolve;
    }

    upstream chat_ws_upstream {
        zone chat_ws 64k;
        server chat-ws:8081 resolve;
    }

    server {
        listen 80;

        # WebSocket route to chat-ws module
        location /ws-stomp {
            proxy_pass http://chat_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST API and Static UI route to chat-api module
        location / {
            proxy_pass http://chat_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
